[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "capsnap"
version = "1.0.1"
authors = [
  { name = "anbuinfosec", email = "anbuinfosec@gmail.com" },
]
maintainers = [
  { name = "anbuinfosec", email = "anbuinfosec@gmail.com" },
]
description = "A pure-Python CAPTCHA solver and OCR engine — zero dependencies, built from scratch."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

keywords = [
  "captcha-solver",
  "captcha",
  "captcha-bypass",
  "captcha-recognition",
  "captcha-breaker",
  "ocr",
  "optical-character-recognition",
  "image-recognition",
  "image-processing",
  "neural-network",
  "mlp",
  "pure-python",
  "zero-dependency",
  "no-dependencies",
  "character-recognition",
  "text-recognition",
  "otsu-threshold",
  "binarization",
  "connected-components",
  "standard-library",
  "no-opencv",
  "no-tesseract",
  "no-pillow",
  "automation",
  "web-scraping",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
"Homepage"      = "https://github.com/anbuinfosec/capsnap"
"Repository"    = "https://github.com/anbuinfosec/capsnap"
"Documentation" = "https://github.com/anbuinfosec/capsnap#readme"
"Bug Tracker"   = "https://github.com/anbuinfosec/capsnap/issues"
"Changelog"     = "https://github.com/anbuinfosec/capsnap/releases"

[project.scripts]
capsnap = "capsnap.cli:main"

[tool.setuptools]
include-package-data = true
packages = ["capsnap", "capsnap.decoder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
