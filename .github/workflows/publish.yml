name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"   # triggers on tags like v0.1.0, v1.2.3

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/capsnap/

    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Patch version in pyproject.toml
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.version.outputs.VERSION }}\"/" pyproject.toml

      - name: Build distribution
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Uses OIDC Trusted Publishing — no API token needed if configured.
          # To use an API token instead, uncomment the next line and add the
          # secret PYPI_API_TOKEN to your repo.
          # password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true
